[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "confdyn"
version = "0.1.0"
description = "Confidence-dynamics-aware test-time aggregation for LLM reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "transformers==5.12.1",
  "numpy",
  "tqdm",
  "requests",
  "math_verify",
  "latex2sympy2_extended",
  "pytest",
]
[project.optional-dependencies]
# Torch / CUDA kernels / patched SGLang: use bash configure.sh
dev = ["pytest"]

[project.scripts]
confdyn = "confdyn.generate:main"

[tool.setuptools.packages.find]
include = ["confdyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
